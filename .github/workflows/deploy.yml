name: CD

on:
  push:
    branches:
      - "**"

jobs:
  build-push:
    runs-on: ubuntu-22.04

    permissions:
      contents: read # Allows reading repository content
      packages: write # Allows publishing packages to GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}_fe:latest
            ghcr.io/${{ github.repository }}_fe:${{ github.run_number }}
            
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}_api:latest
            ghcr.io/${{ github.repository }}_api:${{ github.run_number }}

  deploy:
    runs-on: ubuntu-22.04
    needs: [build-push]

    steps:
      - name: Deploy on server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: . ./deploy.sh
