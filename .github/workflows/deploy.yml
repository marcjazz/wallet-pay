name: CD

on:
  push:
    branches:
      - '**'

permissions:
  contents: read # Allows reading repository content
  packages: write # Allows publishing packages to GHCR

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        service:
          - {
              name: customer-web,
              dockerfile: Dockerfile.app,
              image_suffix: _fe,
            }
          - { name: wallet-api, dockerfile: Dockerfile.api, image_suffix: _api }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build & Publish ${{ matrix.service.name }}
        uses: ./.github/actions/build
        with:
          publish: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          dockerfile: ${{ matrix.service.dockerfile }}
          docker-image-tags: |
            ghcr.io/${{ github.repository }}${{ matrix.service.image_suffix }}:latest
            ghcr.io/${{ github.repository }}${{ matrix.service.image_suffix }}:${{ github.run_number }}

  deploy:
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy Web & Api 
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: . ./deploy.sh
